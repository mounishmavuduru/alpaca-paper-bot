name: Sector Rotation Bot
# Monthly: 1st of the month, 22:17 UTC — 30 min after the RSI bot's slot, an uncommon
# minute, and serialized with it via the shared concurrency group (they raced within
# 3 seconds on 2026-07-01). Weekend 1sts are fine: Friday's close is a valid monthly
# signal and queued orders fill at the next open, idempotently.
on:
  schedule:
    - cron: '17 22 1 * *'
  workflow_dispatch: {}

concurrency:
  group: alpaca-account
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Run rotation bot
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          DRY_RUN_ROT: ${{ vars.DRY_RUN_ROT || '' }}
          KILL_SWITCH: ${{ vars.KILL_SWITCH || 'false' }}
          KILL_SWITCH_ROT: ${{ vars.KILL_SWITCH_ROT || '' }}
          SECTORS: ${{ vars.SECTORS || 'XLK,XLF,XLE,XLV,XLY,XLI,XLP,XLU,XLB,XLRE,XLC' }}
          SYMBOLS: ${{ vars.SYMBOLS || 'SPY,QQQ,DIA,IWM,VTI,MDY,SMH,SOXX,XBI,KRE,ITB,XOP,GDX,EEM,EFA,FXI,EWZ,TLT,IEF,HYG,GLD,SLV' }} # RSI bot's turf (for the overlap guard)
          TOP_N: ${{ vars.TOP_N || '3' }}
          MOM_SKIP: ${{ vars.MOM_SKIP || '21' }}            # 21 = academic 12-1 momentum (skip the mean-reverting last month)
          MOM_BLEND: ${{ vars.MOM_BLEND || 'false' }}       # 'true' = rank on mean of 3m/6m/12-1m momentum
          ROT_ALLOC_PCT: ${{ vars.ROT_ALLOC_PCT || '90' }}  # % of equity the rotation sleeve may deploy
          MAX_DRAWDOWN_PCT: ${{ vars.MAX_DRAWDOWN_PCT || '12' }}
          CIRCUIT_RESET: ${{ vars.CIRCUIT_RESET || 'false' }}
          DATA_FEED: ${{ vars.DATA_FEED || 'sip' }}
          ALLOW_INTRADAY: ${{ vars.ALLOW_INTRADAY || 'false' }}
        run: node rotation_bot.mjs
      - name: Commit journal
        if: always()
        run: |
          [ -d journal ] || exit 0
          git config user.name "trade-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal/
          git diff --cached --quiet && exit 0
          git commit -m "journal: rotation $(date -u +%F) run ${GITHUB_RUN_ID} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 3
          done
          echo "journal push failed after retries" >&2
          exit 1
      - name: Discord alert on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          printf '{"content":"🚨 **Rotation bot workflow FAILED** — run %s"}' "${{ github.run_id }}" \
            | curl -sf -H 'Content-Type: application/json' -d @- "$WEBHOOK" || true
